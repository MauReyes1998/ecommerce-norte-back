# NORTE · todo el stack con un comando. El front es otro repo: clónalo al lado de este como ../frontend.
#   cp .env.docker.example .env.docker   (y edita los secretos)
#   docker compose --env-file .env.docker up --build
# Tienda en http://localhost:8080 · API docs en http://localhost:8080/api/docs

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: norte
      POSTGRES_USER: norte
      POSTGRES_PASSWORD: ${DB_PASSWORD:-norte}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norte -d norte"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://norte:${DB_PASSWORD:-norte}@db:5432/norte?schema=public
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (mínimo 16 caracteres)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # El front y el API comparten dominio detrás de nginx, así que CORS apunta al mismo origen.
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-NORTE <no-reply@norte.mx>}
    volumes:
      # Las imágenes que sube el admin sobreviven a los reinicios.
      - uploads:/app/uploads

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /api/v1
        VITE_WHATSAPP: ${WHATSAPP:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  db_data:
  uploads:
